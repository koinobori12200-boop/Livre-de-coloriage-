<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ff6b9d">
<meta name="description" content="Mon Livre Magique - Jeux éducatifs pour enfants">
<title>Mon Livre Magique ✨</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<style>
:root{--pink:#ff6b9d;--purple:#a06bff;--blue:#4ecdc4;--yellow:#ffe66d;--orange:#ffa552;--green:#6bcf7f;--red:#ff5c5c;--dark:#2d1b4e;--shadow:0 10px 30px rgba(45,27,78,.18)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Comic Sans MS','Chalkboard SE',system-ui,sans-serif}
html,body{height:100%;overflow-x:hidden}
body{background:linear-gradient(135deg,#ffd6e8 0%,#c7b8ff 50%,#a0e7e5 100%);color:var(--dark);user-select:none;min-height:100vh;position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(circle at 20% 10%,rgba(255,255,255,.4),transparent 40%),radial-gradient(circle at 80% 90%,rgba(255,255,255,.3),transparent 40%)}

#splash{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:linear-gradient(135deg,#ff6b9d,#a06bff,#4ecdc4);animation:bgShift 8s ease infinite;background-size:200% 200%}
@keyframes bgShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
#splash h1{font-size:2.2rem;color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.3);display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
#splash h1 span{display:inline-block;animation:lb 1.2s ease-in-out infinite}
#splash h1 span:nth-child(2){animation-delay:.1s}#splash h1 span:nth-child(3){animation-delay:.2s}
#splash h1 span:nth-child(4){animation-delay:.3s}#splash h1 span:nth-child(5){animation-delay:.4s}
#splash h1 span:nth-child(6){animation-delay:.5s}#splash h1 span:nth-child(7){animation-delay:.6s}
@keyframes lb{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
#splash .sub{color:#fff;opacity:.9;font-size:1rem;letter-spacing:2px}
#splash .loader{width:60px;height:60px;border:5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#splash.hide{opacity:0;pointer-events:none;transition:opacity .6s}

#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;opacity:0;transition:opacity .6s}
#app.show{opacity:1}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(255,255,255,.55);backdrop-filter:blur(12px);border-bottom:2px solid rgba(255,255,255,.6);position:sticky;top:0;z-index:10}
header .brand{display:flex;align-items:center;gap:8px;font-weight:bold;font-size:1.05rem;color:var(--dark)}
header .brand .logo{font-size:1.5rem;animation:wiggle 2s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
header .actions{display:flex;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:14px;border:none;background:#fff;box-shadow:var(--shadow);font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.icon-btn:active{transform:scale(.9)}
#installBtn{display:none;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;border:none;padding:10px 14px;border-radius:14px;font-weight:bold;font-family:inherit;cursor:pointer;box-shadow:var(--shadow);animation:pulse 2s ease-in-out infinite;font-size:.8rem}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

main{flex:1;padding:16px;max-width:900px;margin:0 auto;width:100%}
.section-title{font-size:1.6rem;margin-bottom:6px;text-align:center;background:linear-gradient(90deg,var(--pink),var(--purple),var(--blue));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.section-sub{text-align:center;color:#666;margin-bottom:20px;font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:#fff;border-radius:24px;padding:20px 14px;text-align:center;box-shadow:var(--shadow);cursor:pointer;position:relative;overflow:hidden;transition:transform .25s cubic-bezier(.34,1.56,.64,1);border:3px solid transparent}
.card:active{transform:scale(.95)}
.card:hover{transform:translateY(-6px)}
.card .emoji{font-size:2.6rem;display:block;margin-bottom:8px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.15))}
.card .name{font-weight:bold;color:var(--dark);font-size:.9rem}
.card .badge{position:absolute;top:8px;right:8px;font-size:1rem}
.card.locked{filter:grayscale(.4);opacity:.85}
.card.locked::after{content:"🔒";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:2rem;opacity:.9}
.card.locked .emoji{opacity:.3}

.back-row{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.back-row h2{font-size:1.3rem}
.list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.list .card{padding:16px 10px}
.list .card .emoji{font-size:2rem}

.game-area{background:#fff;border-radius:28px;padding:20px;box-shadow:var(--shadow);min-height:420px;position:relative;overflow:hidden}
.game-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.game-header h3{font-size:1.1rem;color:var(--purple)}
.game-header .close{background:var(--pink);color:#fff;border:none;width:36px;height:36px;border-radius:50%;font-size:1.1rem;cursor:pointer;box-shadow:0 4px 12px rgba(255,107,157,.4)}

.palette{display:flex;gap:10px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.swatch{width:42px;height:42px;border-radius:50%;cursor:pointer;border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.15);transition:transform .2s}
.swatch.active{transform:scale(1.25);border-color:var(--dark)}
.swatch:active{transform:scale(.9)}
.color-svg{width:100%;max-width:320px;display:block;margin:0 auto;border-radius:16px;background:#fafafa;touch-action:manipulation}
.color-svg .region{cursor:pointer;transition:fill .3s}
.color-svg .region:hover{stroke:var(--pink);stroke-width:3}

.dot-svg{width:100%;max-width:340px;display:block;margin:0 auto;touch-action:manipulation;background:#fafafa;border-radius:16px}
.dot{fill:#fff;stroke:var(--purple);stroke-width:3;cursor:pointer;transition:all .25s;transform-origin:center;transform-box:fill-box}
.dot:hover{transform:scale(1.15)}
.dot.done{fill:var(--green);stroke:var(--green);pointer-events:none;opacity:.7}
.dot-num{font-size:14px;font-weight:bold;fill:var(--dark);pointer-events:none;text-anchor:middle;dominant-baseline:central;font-family:inherit}

.prompt{font-size:1.15rem;text-align:center;margin-bottom:16px;color:var(--dark);font-weight:bold}
.prompt .big{font-size:2.4rem;display:inline-block;animation:popIn .5s;color:var(--purple)}
@keyframes popIn{0%{transform:scale(0) rotate(-20deg)}100%{transform:scale(1) rotate(0)}}
.items-display{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-bottom:20px;min-height:80px;align-items:center}
.items-display .item{font-size:2.2rem;animation:bounceIn .4s cubic-bezier(.34,1.56,.64,1) backwards}
.items-display .item:nth-child(1){animation-delay:.05s}.items-display .item:nth-child(2){animation-delay:.1s}
.items-display .item:nth-child(3){animation-delay:.15s}.items-display .item:nth-child(4){animation-delay:.2s}
.items-display .item:nth-child(5){animation-delay:.25s}.items-display .item:nth-child(6){animation-delay:.3s}
.items-display .item:nth-child(7){animation-delay:.35s}.items-display .item:nth-child(8){animation-delay:.4s}
.items-display .item:nth-child(9){animation-delay:.45s}.items-display .item:nth-child(10){animation-delay:.5s}
@keyframes bounceIn{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.option{background:linear-gradient(135deg,#fff,#f5f0ff);border:3px solid var(--purple);border-radius:20px;padding:16px;font-size:1.8rem;font-weight:bold;cursor:pointer;transition:all .2s;color:var(--dark);font-family:inherit;box-shadow:0 6px 16px rgba(160,107,255,.2)}
.option:active{transform:scale(.94)}
.option.correct{background:linear-gradient(135deg,#6bcf7f,#4ecdc4);border-color:var(--green);color:#fff;animation:sp .5s}
.option.wrong{background:#ffd6d6;border-color:#ff5c5c;animation:shake .4s}
@keyframes sp{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

.memo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:380px;margin:0 auto}
.memo-card{aspect-ratio:1;border-radius:14px;cursor:pointer;position:relative;transform-style:preserve-3d;transition:transform .5s;background:transparent}
.memo-card .face{position:absolute;inset:0;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;backface-visibility:hidden;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.memo-card .back{background:linear-gradient(135deg,var(--purple),var(--blue));color:#fff;font-size:1.3rem}
.memo-card .front{background:#fff;transform:rotateY(180deg);border:2px solid var(--yellow)}
.memo-card.flipped{transform:rotateY(180deg)}
.memo-card.matched .front{background:linear-gradient(135deg,#6bcf7f,#4ecdc4);border-color:var(--green)}
.memo-card.matched{pointer-events:none}

.puzzle-grid{display:grid;gap:4px;max-width:340px;margin:0 auto;background:#f0e8ff;padding:6px;border-radius:16px}
.puzzle-tile{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:bold;cursor:pointer;background:linear-gradient(135deg,var(--purple),var(--blue));color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.15);transition:all .2s;font-family:inherit}
.puzzle-tile.empty{background:transparent;box-shadow:none;cursor:default}
.puzzle-tile.solved{background:linear-gradient(135deg,#6bcf7f,#4ecdc4)}
.shadow-opt{background:#2d1b4e;color:#2d1b4e;border-color:#2d1b4e;filter:brightness(0);transition:all .2s}
.shadow-opt span{filter:none;color:#fff;font-size:2rem}
.shadow-opt.correct{background:var(--green);filter:none}

.win{position:absolute;inset:0;background:rgba(255,255,255,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;border-radius:28px;animation:fadeIn .4s;z-index:5;padding:20px;text-align:center}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.win .trophy{font-size:5rem;animation:tb .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes tb{0%{transform:scale(0) rotate(-180deg)}100%{transform:scale(1) rotate(0)}}
.win h2{color:var(--green);font-size:1.6rem}
.win button{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;border:none;padding:14px 30px;border-radius:20px;font-size:1rem;font-weight:bold;font-family:inherit;cursor:pointer;box-shadow:0 8px 20px rgba(160,107,255,.4)}

.modal{position:fixed;inset:0;background:rgba(45,27,78,.6);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal.show{display:flex;animation:fadeIn .3s}
.modal-box{background:#fff;border-radius:28px;padding:28px 24px;max-width:340px;width:100%;text-align:center;animation:mIn .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes mIn{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
.modal-box .icon{font-size:3rem;margin-bottom:10px}
.modal-box h3{color:var(--purple);margin-bottom:8px}
.modal-box p{color:#666;font-size:.9rem;margin-bottom:16px}
.modal-box input{width:100%;padding:14px;font-size:1.4rem;text-align:center;border:3px solid var(--purple);border-radius:16px;font-family:inherit;letter-spacing:8px;margin-bottom:12px;outline:none;color:var(--dark)}
.modal-box input:focus{border-color:var(--pink)}
.modal-box .btns{display:flex;gap:10px}
.modal-box button{flex:1;padding:14px;border-radius:16px;border:none;font-family:inherit;font-size:1rem;font-weight:bold;cursor:pointer}
.modal-box .cancel{background:#eee;color:#666}
.modal-box .ok{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff}
.modal-box .error{color:#ff5c5c;font-size:.85rem;margin-top:8px;display:none}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden}
.confetti-piece{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:cf linear forwards}
@keyframes cf{to{transform:translateY(105vh) rotate(720deg);opacity:0}}
footer{text-align:center;padding:14px;color:#666;font-size:.75rem}
@media(max-width:480px){.section-title{font-size:1.3rem}header .brand{font-size:.85rem}.list{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="splash">
  <h1><span>M</span><span>o</span><span>n</span><span> </span><span>L</span><span>i</span><span>v</span><span>r</span><span>e</span></h1>
  <h1><span>M</span><span>a</span><span>g</span><span>i</span><span>q</span><span>u</span><span>e</span></h1>
  <div class="sub">JEUX ÉDUCATIFS ✨</div>
  <div class="loader"></div>
</div>

<div id="app">
  <header>
    <div class="brand"><span class="logo">📚</span><span>Mon Livre Magique</span></div>
    <div class="actions">
      <button id="installBtn">📲 Installer</button>
      <button class="icon-btn" onclick="goHome()" title="Accueil">🏠</button>
    </div>
  </header>
  <main id="main"></main>
  <footer>© Mon Livre Magique — 54 jeux éducatifs</footer>
</div>

<div class="modal" id="pwModal">
  <div class="modal-box">
    <div class="icon">🔐</div>
    <h3>Contenu Premium</h3>
    <p>Entre le mot de passe pour débloquer tous les jeux</p>
    <input type="password" id="pwInput" inputmode="numeric" maxlength="6" placeholder="••••">
    <div class="btns">
      <button class="cancel" onclick="closePw()">Annuler</button>
      <button class="ok" onclick="checkPw()">Débloquer</button>
    </div>
    <div class="error" id="pwError">❌ Mot de passe incorrect</div>
  </div>
</div>

<div id="confetti"></div>

<script>
const PASSWORD = "2080";
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

const state = { unlocked: localStorage.getItem('mlm_unlocked')==='1', category:null, game:null, color:'#ff6b9d', sounds:true };

/* SONS */
let audioCtx = null;
function ensureAudio(){ if(!audioCtx) try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
function playTone(freq,dur=.1,type='sine',vol=.08){ if(!state.sounds) return; ensureAudio(); if(!audioCtx) return; const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.type=type; o.frequency.value=freq; o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(vol,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur); o.start(); o.stop(audioCtx.currentTime+dur); }
function playSuccess(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>playTone(f,.18,'triangle',.1),i*90)); }
function playWrong(){ playTone(180,.25,'sawtooth',.1); }
function playClick(){ playTone(700,.06,'sine',.05); }
function playCut(){ playTone(900,.05,'square',.04); }

function confetti(count=60){
  const layer = $('#confetti');
  const colors = ['#ff6b9d','#a06bff','#4ecdc4','#ffe66d','#ffa552','#6bcf7f'];
  for(let i=0;i<count;i++){
    const c = document.createElement('div');
    c.className = 'confetti-piece';
    c.style.left = Math.random()*100+'%';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDuration = (1.2+Math.random()*1.2)+'s';
    c.style.animationDelay = (Math.random()*0.4)+'s';
    c.style.width = (6+Math.random()*8)+'px';
    c.style.height = (10+Math.random()*10)+'px';
    layer.appendChild(c);
    setTimeout(()=>c.remove(),3000);
  }
}

/* ============ CATALOGUE COMPLET : 54 JEUX ============ */
const CATEGORIES = {
  coloriage:{name:'Coloriage',emoji:'🎨',color:'#ff6b9d',games:[
    {id:'house',name:'Ma Maison',emoji:'🏠',free:true},
    {id:'cat',name:'Le Chat',emoji:'🐱',free:true},
    {id:'sun',name:'Le Soleil',emoji:'☀️',free:true},
    {id:'fish',name:'Le Poisson',emoji:'🐟'},
    {id:'flower',name:'La Fleur',emoji:'🌸'},
    {id:'butterfly',name:'Le Papillon',emoji:'🦋'},
    {id:'elephant',name:"L'Éléphant",emoji:'🐘'},
    {id:'lion',name:'Le Lion',emoji:'🦁'},
    {id:'rocket',name:'La Fusée',emoji:'🚀'},
    {id:'star',name:"L'Étoile",emoji:'⭐'}
  ]},
  decoupage:{name:'Découpage',emoji:'✂️',color:'#a06bff',games:[
    {id:'lines',name:'Lignes Droites',emoji:'➖',free:true},
    {id:'zigzag',name:'Zigzags',emoji:'〽️',free:true},
    {id:'circles',name:'Cercles',emoji:'⭕',free:true},
    {id:'spiral',name:'La Spirale',emoji:'🌀'},
    {id:'bridges',name:'Les Ponts',emoji:'🌉'},
    {id:'rain',name:'La Pluie',emoji:'🌧️'},
    {id:'waves',name:'Les Vagues',emoji:'🌊'},
    {id:'castle',name:'Le Château',emoji:'🏰'},
    {id:'hedgehog',name:'Hérisson',emoji:'🦔'},
    {id:'maze',name:'Le Labyrinthe',emoji:'🧭'}
  ]},
  chiffres:{name:'Chiffres',emoji:'🔢',color:'#4ecdc4',games:[
    {id:'count1',name:'Compte 1-5',emoji:'🍌',free:true},
    {id:'count2',name:'Compte 1-10',emoji:'🥭',free:true},
    {id:'moreless',name:'Plus ou Moins',emoji:'⚖️',free:true},
    {id:'addition',name:'Additions',emoji:'➕'},
    {id:'missing',name:'Chiffre Manquant',emoji:'❓'},
    {id:'biggest',name:'Le Plus Grand',emoji:'🔝'},
    {id:'numberen',name:'En Anglais',emoji:'🇬🇧'},
    {id:'nextnum',name:'Suite Logique',emoji:'🔗'}
  ]},
  lettres:{name:'Lettres',emoji:'🔤',color:'#ffa552',games:[
    {id:'letter1',name:'A B C',emoji:'🅰️',free:true},
    {id:'letter2',name:'1ère Lettre',emoji:'🔍',free:true},
    {id:'vowels',name:'Voyelles',emoji:'✏️',free:true},
    {id:'missingletter',name:'Lettre Manquante',emoji:'❔'},
    {id:'upperlower',name:'MAJ / min',emoji:'🔠'},
    {id:'imagel',name:'Image → Lettre',emoji:'🖼️'},
    {id:'alphaorder',name:'Ordre Alpha',emoji:'📋'},
    {id:'alphasong',name:'Chanson ABC',emoji:'🎵'}
  ]},
  couleurs:{name:'Couleurs',emoji:'🌈',color:'#ffe66d',games:[
    {id:'colors1',name:'Trouve Couleur',emoji:'🎯',free:true},
    {id:'colors2',name:'Fruit & Couleur',emoji:'🍎',free:true},
    {id:'colors3',name:'Objets Colorés',emoji:'🔵',free:true},
    {id:'mixing',name:'Mélange Magique',emoji:'🧪'},
    {id:'rainbow',name:'Arc-en-ciel',emoji:'🌈'},
    {id:'sortcolor',name:'Trie les Ballons',emoji:'🎈'},
    {id:'coloren',name:'En Anglais',emoji:'🇬🇧'},
    {id:'missingcolor',name:'Couleur Manquante',emoji:'🕳️'}
  ]},
  memoire:{name:'Mémoire & Puzzle',emoji:'🧩',color:'#6bcf7f',games:[
    {id:'mem-animals',name:'Mémoire Animaux',emoji:'🦁',free:true},
    {id:'shadow',name:'Trouve Ombre',emoji:'🌑',free:true},
    {id:'intruder',name:'Trouve Intrus',emoji:'🔎',free:true},
    {id:'mem-fruits',name:'Mémoire Fruits',emoji:'🍎'},
    {id:'mem-vehicles',name:'Mémoire Véhicules',emoji:'🚗'},
    {id:'puzzle3',name:'Puzzle 3x3',emoji:'🧩'},
    {id:'puzzle4',name:'Puzzle 4x4',emoji:'🎲'},
    {id:'mother',name:'Maman & Bébé',emoji:'👶'},
    {id:'maze-animal',name:'Labyrinthe Singe',emoji:'🐒'},
    {id:'place',name:'Objet → Lieu',emoji:'🏠'}
  ]}
};

/* NAVIGATION */
function goHome(){ playClick(); state.category=null; state.game=null; renderHome(); window.scrollTo({top:0,behavior:'smooth'}); }
function openCategory(catId){ playClick(); state.category=catId; renderCategory(catId); window.scrollTo({top:0,behavior:'smooth'}); }
function openGame(catId,gameId){
  const cat = CATEGORIES[catId];
  const game = cat.games.find(g=>g.id===gameId);
  if(!game) return;
  if(!game.free && !state.unlocked){ showPw(); return; }
  playClick(); state.category=catId; state.game=gameId; renderGame(catId,gameId);
}

/* PASSWORD */
function showPw(){ $('#pwModal').classList.add('show'); setTimeout(()=>$('#pwInput').focus(),100); }
function closePw(){ $('#pwModal').classList.remove('show'); $('#pwInput').value=''; $('#pwError').style.display='none'; }
function checkPw(){
  if($('#pwInput').value.trim()===PASSWORD){
    state.unlocked=true; localStorage.setItem('mlm_unlocked','1'); closePw(); playSuccess(); confetti(40);
    if(state.category) renderCategory(state.category); else renderHome();

/* RENDER CATEGORY */
function renderCategory(catId){
  const cat = CATEGORIES[catId];
  const main = $('#main');
  main.innerHTML = `
    <div class="back-row">
      <button class="icon-btn" onclick="goHome()">←</button>
      <h2>${cat.emoji} ${cat.name}</h2>
    </div>

  cat.games.forEach((g,i)=>{
    const locked = !g.free && !state.unlocked;
    const el = document.createElement('div');
    el.className = 'card'+(locked?' locked':'');
    el.style.animation = `bounceIn .4s ${i*0.06}s backwards`;
    el.style.borderColor = cat.color;
    el.innerHTML = `<span class="badge">${locked?'🔒':'▶️'}</span>
      <span class="emoji">${g.emoji}</span><div class="name">${g.name}</div>`;
    el.onclick = () => openGame(catId,g.id);
    $('#gameList').appendChild(el);
  });
}

/* RENDER GAME */
function renderGame(catId,gameId){
  const cat = CATEGORIES[catId];
  const game = cat.games.find(g=>g.id===gameId);
  $('#main').innerHTML = `
    <div class="game-area" id="gameArea">
      <div class="game-header"><h3>${game.emoji} ${game.name}</h3>
        <button class="close" onclick="openCategory('${catId}')">✕</button></div>

}

      const t = document.createElementNS(svgNS,'text');
      t.setAttribute('x',p[0]); t.setAttribute('y',p[1]); t.setAttribute('class','dot-num');
      t.textContent = i+1;
      g.appendChild(c); g.appendChild(t);

        if(i!==next){ playWrong(); return; }
        c.classList.add('done'); next++; playCut();

      });
      svg.appendChild(g);

function buildCount(maxN, rounds){
  return (body)=>{
    let round=0;
    function next(){
      if(round>=rounds){ showWin(); return; }
      round++;
      const n = 1+Math.floor(Math.random()*maxN);
      const item = ['🍌','🥭','🍎','🍊','🍇','🥑','🍓','🍍','🐟','🦋'][Math.floor(Math.random()*10)];
      const opts = new Set([n]);
      while(opts.size<4) opts.add(1+Math.floor(Math.random()*maxN));
      const arr = [...opts].sort(()=>Math.random()-0.5);
      body.innerHTML = `<p class="prompt">Combien de ${item} ?</p>
        <div class="items-display">${Array(n).fill(`<span class="item">${item}</span>`).join('')}</div>
        <div class="options">${arr.map(v=>`<button class="option" data-v="${v}">${v}</button>`).join('')}</div>`;
      body.querySelectorAll('.option').forEach(b=>{
        b.onclick = ()=>{
          if(parseInt(b.dataset.v)===n){ b.classList.add('correct'); playTone(880,.15,'triangle'); confetti(15); setTimeout(next,900); }
          else { b.classList.add('wrong'); playWrong(); setTimeout(()=>b.classList.remove('wrong'),500); }
        };
      });
    }
    next();
  };
}

  {letter:'C',word:'Chat',emoji:'🐱'},{letter:'D',word:'Dauphin',emoji:'🐬'},
  {letter:'E',word:'Éléphant',emoji:'🐘'},{letter:'F',word:'Fleur',emoji:'🌸'},
  {letter:'G',word:'Girafe',emoji:'🦒'},{letter:'H',word:'Hérisson',emoji:'🦔'},
  {letter:'L',word:'Lion',emoji:'🦁'},{letter:'M',word:'Mangue',emoji:'🥭'},
  {letter:'P',word:'Poisson',emoji:'🐟'},{letter:'S',word:'Soleil',emoji:'☀️'},
  {letter:'T',word:'Tigre',emoji:'🐯'},{letter:'V',word:'Voiture',emoji:'🚗'}
];

GAME_HANDLERS['lettres:letter1'] = (body)=>{
  let round=0;
  function next(){
    if(round>=6){ showWin(); return; }
    round++;
    const c = LETTER_DATA[Math.floor(Math.random()*LETTER_DATA.length)];
    const others = LETTER_DATA.filter(d=>d.letter!==c.letter).sort(()=>Math.random()-0.5).slice(0,2);
    const arr = [c,...others].sort(()=>Math.random()-0.5);
    body.innerHTML = `<p class="prompt">Mot commençant par <span class="big">${c.letter}</span> ?</p>
      <div class="options" style="grid-template-columns:1fr 1fr 1fr">
        ${arr.map(o=>`<button class="option" data-w="${o.letter}" style="flex-direction:column;font-size:1rem">
          <div style="font-size:2rem">${o.emoji}</div><div style="font-size:.7rem;margin-top:4px">${o.word}</div></button>`).join('')}
      </div>`;
    body.querySelectorAll('.option').forEach(b=>{
      b.onclick = ()=>{
        if(b.dataset.w===c.letter){ b.classList.add('correct'); playTone(880,.15,'triangle'); confetti(15); setTimeout(next,900); }
        else { b.classList.add('wrong'); playWrong(); setTimeout(()=>b.classList.remove('wrong'),500); }
      };
    });
  }
  next();
};

const WORDS = ['CHAT','LION','LUNE','BEBE','BALLON','ECOLE','FLEUR','POMME','ROBE','VACHE'];
GAME_HANDLERS['lettres:missingletter'] = (body)=>{
  let round=0;
  function next(){
    if(round>=5){ showWin(); return; }
    round++;
    const w = WORDS[Math.floor(Math.random()*WORDS.length)];
    const idx = Math.floor(Math.random()*w.length);
    const ans = w[idx];
    const shown = w.split('').map((l,i)=>i===idx?'_':l).join('');
    const opts = new Set([ans]);
    while(opts.size<4) opts.add(String.fromCharCode(65+Math.floor(Math.random()*26)));
    body.innerHTML = `<p class="prompt">Lettre manquante dans : <span style="color:var(--purple);letter-spacing:4px">${shown}</span></p>

    body.querySelectorAll('.option').forEach(b=>{
      b.onclick = ()=>{
        if(b.dataset.l===ans){ b.classList.add('correct'); playTone(880,.15,'triangle'); confetti(15); setTimeout(next,900); }
        else { b.classList.add('wrong'); playWrong(); setTimeout(()=>b.classList.remove('wrong'),500); }
      };
    });
  }
  next();
};

GAME_HANDLERS['lettres:upperlower'] = (body)=>{
  let round=0;
  function next(){
    if(round>=6){ showWin(); return; }
    round++;
    const upper = String.fromCharCode(65+Math.floor(Math.random()*26));
    const lower = upper.toLowerCase();
    const wrong = [];
    while(wrong.length<3){
      const l = String.fromCharCode(97+Math.floor(Math.random()*26));
      if(l!==lower && !wrong.includes(l)) wrong.push(l);

    body.innerHTML = `<p class="prompt">La minuscule de <span class="big">${upper}</span> est ?</p>
      <div class="options">${[lower,...wrong].sort(()=>Math.random()-0.5).map(l=>`<button class="option" data-l="${l}" style="font-size:2rem">${l}</button>`).join('')}</div>`;
    body.querySelectorAll('.option').forEach(b=>{

        if(b.dataset.l===lower){ b.classList.add('correct'); playTone(880,.15,'triangle'); confetti(15); setTimeout(next,900); }
        else { b.classList.add('wrong'); playWrong(); setTimeout(()=>b.classList.remove('wrong'),500); }
      };
    });
  }
  next();
};

GAME_HANDLERS['lettres:alphasong'] = (body)=>{
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  let idx = 0;
  body.innerHTML = `<p class="prompt">Écoute et touche les lettres dans l'ordre !</p>
    <div id="alphasGrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:360px;margin:0 auto"></div>
    <p style="text-align:center;margin-top:16px;font-size:1.3rem;color:var(--purple);font-weight:bold" id="alphasMsg">Touche A</p>`;
  const grid = $('#alphasGrid');
  const shuffled = [...letters].sort(()=>Math.random()-0.5);
  shuffled.forEach(l=>{
    const b = document.createElement('button');
    b.className = 'option';
    b.style.fontSize='1.3rem';
    b.style.padding='10px';
    b.textContent = l;
    b.onclick = ()=>{
      if(l === letters[idx]){
        b.classList.add('correct'); b.disabled = true;
        playTone(600+idx*15,.1,'triangle');
        idx++;

        $('#alphasMsg').textContent = 'Touche ' + letters[idx];

    grid.appendChild(b);

GAME_HANDLERS['couleurs:sortcolor'] = (body)=>{
  let round=0;
  function next(){
    if(round>=4){ showWin(); return; }
    round++;
    const c = COLOR_ITEMS[Math.floor(Math.random()*COLOR_ITEMS.length)];
    const targetN = 3+Math.floor(Math.random()*3);
    const total = targetN + 3+Math.floor(Math.random()*3);
    const items = [];
    for(let i=0;i<targetN;i++) items.push({color:c.name,emoji:'🎈'});
    while(items.length<total){
      const o = COLOR_ITEMS[Math.floor(Math.random()*COLOR_ITEMS.length)];
      if(o.name!==c.name) items.push({color:o.name,emoji:'🎈'});
    }
    body.innerHTML = `<p class="prompt">Clique tous les ballons <span style="color:${c.hex};-webkit-text-fill-color:${c.hex};-webkit-text-stroke:2px #333">${c.name}</span></p>
      <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:14px" id="balloons"></div>`;
    let found=0;
    items.sort(()=>Math.random()-0.5).forEach(it=>{
      const ci = COLOR_ITEMS.find(x=>x.name===it.color);
      const b = document.createElement('div');
      b.style.fontSize='2.4rem';
      b.style.cursor='pointer';
      b.style.transition='all .3s';
      b.textContent='🎈';
      b.style.filter = `hue-rotate(${Math.random()*360}deg)`;
      b.style.color = ci.hex;
      b.style.webkitTextStroke = '0';
      // Use colored circle instead
      b.innerHTML = `<div style="width:44px;height:52px;border-radius:50% 50% 50% 50%;background:${ci.hex};box-shadow:inset -8px -8px 0 rgba(0,0,0,.1);display:inline-block"></div>`;
      b.onclick = ()=>{
        if(it.color === c.name){
          if(b.classList.contains('correct')) return;
          b.classList.add('correct');
          b.style.transform = 'scale(1.2)';
          playTone(700+found*80,.08);
          found++;
          if(found>=targetN){ playTone(880,.15,'triangle'); confetti(20); setTimeout(next,900); }
        } else { playWrong(); b.style.transform='scale(.9)'; setTimeout(()=>b.style.transform='',300); }
      };
      $('#balloons').appendChild(b);
    });
  }
  next();
};

function buildMemory(emojis){
  return (body)=>{
    const pairs = [...emojis,...emojis].sort(()=>Math.random()-0.5);
    let flipped = [], matched = 0, lock = false;
    body.innerHTML = `<p class="prompt">Trouve toutes les paires ! 🧠</p>
      <div class="memo-grid" id="memoGrid"></div>
      <p style="text-align:center;margin-top:12px;color:#666;font-size:.8rem" id="memoCount">0 / ${emojis.length}</p>`;
    const grid = $('#memoGrid');
    pairs.forEach(e=>{
      const card = document.createElement('div');
      card.className='memo-card';
      card.dataset.emoji=e;
      card.innerHTML = `<div class="face back">❓</div><div class="face front">${e}</div>`;
      card.onclick = ()=>{
        if(lock || card.classList.contains('flipped') || card.classList.contains('matched')) return;
        card.classList.add('flipped'); playTone(600,.06);
        flipped.push(card);
        if(flipped.length===2){
          lock = true;
          const [a,b] = flipped;
          if(a.dataset.emoji===b.dataset.emoji){
            a.classList.add('matched'); b.classList.add('matched');
            playTone(880,.15,'triangle'); matched++;
            $('#memoCount').textContent = matched+' / '+emojis.length;
            flipped=[]; lock=false;
            if(matched===emojis.length) setTimeout(showWin,500);
          } else {
            setTimeout(()=>{ a.classList.remove('flipped'); b.classList.remove('flipped'); flipped=[]; lock=false; },800);
          }
        }
      };
      grid.appendChild(card);
    });
  };
}

function buildPuzzle(size){
  return (body)=>{
    let tiles = [];
    const solved = [];
    for(let i=1;i<size*size;i++) solved.push(i);
    solved.push(0);
    function init(){
      tiles = [...solved];
      for(let i=0;i<300;i++){
        const empty = tiles.indexOf(0);
        const moves = getMoves(empty);
        const m = moves[Math.floor(Math.random()*moves.length)];
        [tiles[empty],tiles[m]] = [tiles[m],tiles[empty]];
      }
      if(tiles.every((v,i)=>v===solved[i])) init();
    }
    function getMoves(i){
      const r = Math.floor(i/size), c = i%size, m=[];
      if(r>0) m.push(i-size);
      if(r<size-1) m.push(i+size);
      if(c>0) m.push(i-1);
      if(c<size-1) m.push(i+1);
      return m;
    }
    function render(){
      body.innerHTML = `<p class="prompt">Remets les nombres dans l'ordre ! 🧩</p>
        <div class="puzzle-grid" style="grid-template-columns:repeat(${size},1fr);max-width:${size*60+20}px" id="puzzleGrid"></div>`;
      const grid = $('#puzzleGrid');
      tiles.forEach((v,i)=>{
        const t = document.createElement('div');
        t.className = 'puzzle-tile'+(v===0?' empty':'');
        if(v!==0) t.textContent = v;
        t.onclick = ()=>{
          const empty = tiles.indexOf(0);
          if(getMoves(empty).includes(i)){
            [tiles[empty],tiles[i]] = [tiles[i],tiles[empty]];
            playTone(500,.06); render(); check();
          }
        };
        grid.appendChild(t);
      });
    }
    function check(){
      if(tiles.every((v,i)=>v===solved[i])){
        $$('.puzzle-tile').forEach(t=>t.classList.add('solved'));
        setTimeout(showWin,500);
      }
    }
    init(); render();
  };
}

GAME_HANDLERS['memoire:maze-animal'] = (body)=>{
  // Path dots, monkey to banana
  const path = [[40,40],[80,60],[120,40],[160,80],[200,60],[240,100],[200,140],[160,180],[120,220],[80,260],[40,240]];
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS,'svg');
  svg.setAttribute('viewBox','0 0 300 300');
  svg.setAttribute('class','dot-svg');
  const poly = document.createElementNS(svgNS,'polyline');
  poly.setAttribute('points',path.map(p=>p[0]+','+p[1]).join(' '));
  poly.setAttribute('fill','none'); poly.setAttribute('stroke','#ddd');
  poly.setAttribute('stroke-width','3'); poly.setAttribute('stroke-dasharray','8,6');
  svg.appendChild(poly);
  // Monkey at start
  const monkey = document.createElementNS(svgNS,'text');
  monkey.setAttribute('x',path[0][0]); monkey.setAttribute('y',path[0][1]);
  monkey.setAttribute('text-anchor','middle'); monkey.setAttribute('dominant-baseline','central');
  monkey.setAttribute('font-size','32'); monkey.textContent = '🐒';
  svg.appendChild(monkey);
  // Banana at end
  const banana = document.createElementNS(svgNS,'text');
  banana.setAttribute('x',path[path.length-1][0]); banana.setAttribute('y',path[path.length-1][1]);
  banana.setAttribute('text-anchor','middle'); banana.setAttribute('dominant-baseline','central');
  banana.setAttribute('font-size','32'); banana.textContent = '🍌';
  svg.appendChild(banana);
  // Dots
  let next=0;
  path.forEach((p,i)=>{
    const c = document.createElementNS(svgNS,'circle');
    c.setAttribute('cx',p[0]); c.setAttribute('cy',p[1]); c.setAttribute('r','12');
    c.setAttribute('class','dot');
    c.addEventListener('click',()=>{
      if(i!==next){ playWrong(); return; }
      c.classList.add('done'); next++; playCut();
      if(next===path.length){ poly.setAttribute('stroke','#6bcf7f'); poly.setAttribute('stroke-dasharray','0'); setTimeout(showWin,400); }
    });
    svg.appendChild(c);
  });
  body.innerHTML = `<p class="prompt">Aide le singe 🐒 à trouver la banane 🍌</p>`;
  body.appendChild(svg);
};
